# Workflow derived from r-lib/actions examples:
# https://github.com/r-lib/actions/tree/v2-branch/examples
# Deploys the pkgdown site to GitHub Pages on pushes to master and on tags.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          # clean: true removes files that no longer exist in `docs/`. Without
          # it, pages deleted from the site (e.g. internal working documents
          # that were once published) would stay live on gh-pages forever.
          # The custom domain is configured in the repository's Pages settings,
          # so no CNAME file is needed here.
          clean: true
          branch: gh-pages
          folder: docs
